<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="PizzaTheme.css">
	<title>Basic Page</title>
</head>
<body>
	<div class="wrap">
		<h1>Make your Pizza :</h1>
		<div class="Container">
			
			<!-- Size group - all have name="size" -->
			<div class="Choices">
				<p>Size : </p>
				<div class="control">
					<input id="sizeLarge" name="size" type="radio" class="rd-4" />
					<label for="sizeLarge">Large</label>
				</div>
				<div class="control">
					<input id="sizeMedium" name="size" type="radio" class="rd-4" />
					<label for="sizeMedium">Medium</label>
				</div>
				<div class="control">
					<input id="sizeSmall" name="size" type="radio" class="rd-4" />
					<label for="sizeSmall">Small</label>
				</div>
			</div>

			<!-- Toppings - these are checkboxes, so they don't need grouping -->
			<div class="Choices_toppings">
				<p>Topping : </p>
				<div class="control">
					<input id="topping1" type="checkbox" class="cb-4" />
					<label for="topping1">Pepperoni</label>
				</div>
				<div class="control">
					<input id="topping2" type="checkbox" class="cb-4" />
					<label for="topping2">Mushrooms</label>
				</div>
				<div class="control">
					<input id="topping3" type="checkbox" class="cb-4" />
					<label for="topping3">Onions</label>
				</div>
				<div class="control">
					<input id="topping4" type="checkbox" class="cb-4" />
					<label for="topping4">Sausage</label>
				</div>
				<div class="control">
					<input id="topping5" type="checkbox" class="cb-4" />
					<label for="topping5">Bacon</label>
				</div>
				<div class="control">
					<input id="topping6" type="checkbox" class="cb-4" />
					<label for="topping6">Extra cheese</label>
				</div>
			</div>

			<!-- Crust Type group - all have name="crust" -->
			<div class="Choices">
				<p>Crust Type : </p>
				<div class="control">
					<input id="crustThin" name="crust" type="radio" class="rd-4" />
					<label for="crustThin">Thin</label>
				</div>
				<div class="control">
					<input id="crustThick" name="crust" type="radio" class="rd-4" />
					<label for="crustThick">Thick</label>
				</div>
			</div>

			<!-- Where to eat group - all have name="location" -->
			<div class="Choices">
				<p>Where to eat : </p>
				<div class="control">
					<input id="locationEatIn" name="location" type="radio" class="rd-4" />
					<label for="locationEatIn">Eat in</label>
				</div>
				<div class="control">
					<input id="locationTakeOut" name="location" type="radio" class="rd-4" />
					<label for="locationTakeOut">Take out</label>
				</div>
			</div>

		</div>
		<h1>Order Recpie :</h1>
		<div class="Recipe">
			<div class="Cell">
				<p>Size : </p>
				<p id="lbSize">[????]</p>
			</div>
			<div class="Cell">
				<p>Toppings : </p>
				<p id="lbTopping">[????]</p>
			</div>
			<div class="Cell">
				<p>Crust type : </p>
				<p id="lbCrustType">[????]</p>
			</div>
			<div class="Cell">
				<p>Where to Eat : </p>
				<p id="lbEat">[????]</p>
			</div>
		</div>
		<div class="price">
		<p>Total Price : </p>
		<p>[????]</p>
		</div>
		<div class="Buttons_Container">
			<button>Order Pizza</button>
			<button>Reset form</button>
		</div>
	</div>
</body>
</html>
