<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="PizzaTheme.css">
	<script src="PizzaLogic.js" defer></script>
	<title>Basic Page</title>
</head>
<body>
	<div class="wrap">
		<form>
		<div class="price">
		<p>Total Price : </p>
		<p id="lbTotalPrice">0 $</p>
		</div>
		<h1>Make your Pizza :</h1>
		<div class="Container">
			
			<!-- Size group - all have name="size" -->
			<div class="Choices">
				<p>Size : </p>
				<div class="control">
					<input id="rbSizeLarge" data-size="Large" data-price="50" name="size" type="radio" class="rd-4" data-checked_before="no" />
					<label for="sizeLarge">Large</label>
				</div>
				<div class="control">
					<input id="rdSizeMedium" data-size="Medium" data-price="20" name="size" type="radio" class="rd-4" data-checked_before="no" />
					<label for="sizeMedium">Medium</label>
				</div>
				<div class="control">
					<input id="rbSizeSmall"  data-size="Small" data-price="10" name="size" type="radio" class="rd-4" data-checked_before="no" />
					<label for="sizeSmall">Small</label>
				</div>
			</div>

			<!-- Toppings - these are checkboxes, so they don't need grouping -->
			<div class="Choices_toppings">
				<p>Topping : </p>
				<div class="control">
					<input id="ckPepperoni" data-topping="Pepperoni" data-price="5" type="checkbox" class="cb-4" data-checked_before="no" />
					<label for="topping1">Pepperoni</label>
				</div>
				<div class="control">
					<input id="ckMushrooms" data-topping="Mushrooms" data-price="5" type="checkbox" class="cb-4" data-checked_before="no" />
					<label for="topping2">Mushrooms</label>
				</div>
				<div class="control">
					<input id="ckOnions" data-topping="Onions" data-price="5" type="checkbox" class="cb-4" data-checked_before="no" />
					<label for="topping3">Onions</label>
				</div>
				<div class="control">
					<input id="ckSausage" data-topping="Sausage" data-price="5" type="checkbox" class="cb-4" data-checked_before="no" />
					<label for="topping4">Sausage</label>
				</div>
				<div class="control">
					<input id="ckBacon" data-topping="Bacon" data-price="5" type="checkbox" class="cb-4" data-checked_before="no" />
					<label for="topping5">Bacon</label>
				</div>
				<div class="control">
					<input id="ckCheese" data-topping="Cheese" data-price="5" type="checkbox" class="cb-4" data-checked_before="no" />
					<label for="topping6">Extra cheese</label>
				</div>
			</div>

			<div class="Choices">
				<p>Crust Type : </p>
				<div class="control">
					<input id="crustThin" data-thicknes="Thin" name="crust" data-price="0" type="radio" class="rd-4" data-checked_before="no" />
					<label for="crustThin">Thin</label>
				</div>
				<div class="control">
					<input id="crustThick" data-thicknes="Thick" name="crust" data-price="5" type="radio" class="rd-4" data-checked_before="no" />
					<label for="crustThick">Thick</label>
				</div>
			</div>

			<div class="Choices">
				<p>Where to eat : </p>
				<div class="control">
					<input id="locationEatIn" data-location="In" name="location" type="radio" class="rd-4" data-checked_before="no" />
					<label for="locationEatIn">Eat in</label>
				</div>
				<div class="control">
					<input id="locationTakeOut" data-location="Out" name="location" type="radio" class="rd-4" data-checked_before="no" />
					<label for="locationTakeOut">Take out</label>
				</div>
			</div>

		</div>
		<h1>Order Recpie :</h1>
		<div class="Recipe">
			<div class="Cell">
				<p>Size : </p>
				<p id="lbSize">[????]</p>
			</div>
			<div class="Cell">
				<p>Toppings : </p>
				<p id="lbTopping">[????]</p>
			</div>
			<div class="Cell">
				<p>Crust type : </p>
				<p id="lbCrustType">[????]</p>
			</div>
			<div class="Cell">
				<p>Where to Eat : </p>
				<p id="lbEat">[????]</p>
			</div>
		</div>
		
		<div class="Buttons_Container">
			<button action="submit" id="btnOrder">Order Pizza</button>
			<button id="btnReset">Reset form</button>
		</div>
		</form>
	</div>
</body>
</html>
